name: CI

on:
  push:
    branches: [main, v1_full]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: techzone.settings.development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build front-end assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Compiled CSS / vendor files are committed and current
        run: git diff --exit-code -- static/css/app.css static/vendor
      - name: npm audit (runtime packages)
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt pip-audit

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test
      - name: Production settings pass the deploy checklist
        env:
          DJANGO_SETTINGS_MODULE: techzone.settings.production
          ALLOWED_HOSTS: shop.example.in
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: docker build -t techzone:ci .
