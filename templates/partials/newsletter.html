{% load static %}
<section class="bg-gradient-to-r from-primary-700 to-primary-900 dark:from-primary-900 dark:to-gray-900 py-12">
  <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center gap-8">
    <div class="flex-1 text-center md:text-left">
      <h3 class="text-white text-2xl font-bold mb-1">Stay Updated with  {{ site_settings.site_name | default:"TechZone" }} </h3>
      <p class="text-primary-200 text-sm">Get exclusive deals, new arrivals and tech news straight to your inbox.</p>
    </div>
    <form class="newsletter-form flex w-full md:w-auto gap-2" method="post" action="{% url 'core:newsletter_subscribe' %}">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Your email address" required
        class="flex-1 md:w-72 px-4 py-3 rounded-xl border-0 outline-none text-sm text-gray-800 bg-white">
      <button type="submit" class="bg-accent-500 hover:bg-accent-600 text-white px-5 py-3 rounded-xl font-semibold text-sm transition-colors whitespace-nowrap flex items-center gap-2">
        <i class="ti ti-send"></i> Subscribe
      </button>
    </form>
    <p class="newsletter-msg hidden text-green-300 text-sm mt-2"></p>
  </div>
</section>
