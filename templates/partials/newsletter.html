{% load static %}
<section class="bg-gradient-to-r from-primary-700 to-primary-900 dark:from-primary-900 dark:to-gray-900 py-12">
  <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center gap-8">
    <div class="flex-1 text-center md:text-left">
      <h3 class="text-white text-2xl font-bold mb-1">Stay Updated with  {{ site_name }} </h3>
      <p class="text-primary-200 text-sm">Get exclusive deals, new arrivals and tech news straight to your inbox.</p>
    </div>
    <form class="newsletter-form flex w-full md:w-auto gap-2" method="post" action="{% url 'core:newsletter_subscribe' %}"
          id="newsletter-form" data-ajax-form data-validate data-msg-target="#newsletter-msg"
          data-msg-ok-class="newsletter-msg is-ok" data-msg-err-class="newsletter-msg is-err"
          data-error-text="Please enter a valid email address.">
      {% csrf_token %}{% include "partials/honeypot.html" with hp_id="newsletter" %}
      <div class="field flex-1 md:w-72">
        <input type="email" id="newsletter-email" aria-label="Email address" name="email" placeholder="Your email address" required maxlength="254" autocomplete="email" class="input">
      </div>
      <button type="submit" class="btn btn-accent">
        <i class="ti ti-send"></i> Subscribe
      </button>
    </form>
    <p id="newsletter-msg" class="newsletter-msg hidden" role="status"></p>
  </div>
</section>
