<div class="text-center py-20 col-span-full" id="empty-state">
  <div class="pc-empty-ico w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-5">
    <i class="ti ti-search-off text-4xl" aria-hidden="true"></i>
  </div>
  <h3 class="qv-title text-xl font-bold mb-2">No Products Found</h3>
  <p class="text-muted mb-6 max-w-sm mx-auto">
    Try adjusting your filters or search terms to find what you're looking for.
  </p>
  <div class="flex items-center justify-center gap-3 flex-wrap">
    <a href="{% if clear_url %}{{ clear_url }}{% else %}{% url 'products:list' %}{% endif %}"
       class="btn btn-primary">Clear All Filters</a>
    <a href="{% url 'products:categories' %}" class="btn btn-outline">Browse Categories</a>
  </div>
</div>
