{# Why Choose Us section #}
<section class="py-12 bg-white">
  <div class="container mx-auto px-4">
    {% if section.title %}
      <div class="text-center mb-8">
        <h2 class="text-3xl lg:text-4xl font-bold">{{ section.title }}</h2>
        {% if section.subtitle %}
          <p class="text-gray-600 mt-2 max-w-2xl mx-auto">{{ section.subtitle }}</p>
        {% endif %}
      </div>
    {% endif %}

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for reason in reasons %}
        <div class="text-center">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 mb-4">
            <i class="ti {{ reason.icon }} text-2xl text-blue-600"></i>
          </div>
          <h3 class="text-xl font-semibold mb-2">{{ reason.title }}</h3>
          <p class="text-gray-600">{{ reason.description }}</p>
        </div>
      {% empty %}
        <div class="col-span-full text-center py-12">
          <p class="text-gray-500">No reasons configured</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
