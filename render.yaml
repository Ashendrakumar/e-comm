# Render Blueprint — Render → New → Blueprint → pick this repo.
# Database and uploaded files live on Supabase (see docs/DEPLOY_RENDER.md);
# Render runs the Docker web service and a Key Value (Redis) instance.
# Values marked `sync: false` are asked for when the Blueprint is first applied.
services:
  - type: web
    name: techzone
    runtime: docker
    plan: free                      # starter avoids the 15-minute sleep
    branch: main
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"               # gunicorn in the Dockerfile binds 8000
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false                 # techzone.onrender.com[,shop.example.com]
      - key: CSRF_TRUSTED_ORIGINS
        sync: false                 # https://techzone.onrender.com
      - key: SITE_DOMAIN
        sync: false                 # techzone.onrender.com
      - key: TRUSTED_PROXY_COUNT
        value: "1"

      # Supabase PostgreSQL — same values as your working .env
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false

      # Supabase Storage — uploaded images
      - key: SUPABASE_URL
        sync: false                 # https://<ref>.supabase.co
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false                 # e.g. ap-northeast-1 (Storage → S3 Configuration)

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: techzone-redis
          property: connectionString

  - type: keyvalue
    name: techzone-redis
    plan: free
    ipAllowList: []                 # internal connections only
    maxmemoryPolicy: allkeys-lru    # it's a cache: evict instead of erroring when full
